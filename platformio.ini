; Projeto: Monitor de Alertas Zabbix em ESP32
; Placa padrão: LilyGO TTGO T-Display (ESP32 + tela ST7789 240x135 embutida)
;
; Se você usar outra placa/tela, troque a linha "board" e ajuste
; include/User_Setup.h (veja o README.md).

[env:ttgo-t-display]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_resetmethod = usb_reset

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.1.0
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1

build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -DCORE_DEBUG_LEVEL=0
